<svg xmlns="http://www.w3.org/2000/svg" width="440" height="68" viewBox="0 0 440 68" role="img" aria-label="Download the SmartFridge demo APK">
  <title>Download the SmartFridge demo APK</title>
  <defs>
    <linearGradient id="shimmer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C8F58A" stop-opacity="0"/>
      <stop offset=".5" stop-color="#C8F58A" stop-opacity=".16"/>
      <stop offset="1" stop-color="#C8F58A" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="pill"><rect x=".5" y=".5" width="439" height="67" rx="33.5"/></clipPath>
  </defs>
  <style>
    .shimmer { animation: shimmer 4.5s ease-in-out infinite; }
    @keyframes shimmer { 0%, 40% { transform: translateX(-140px); } 100% { transform: translateX(470px); } }
    .nudge { animation: nudge 2.4s ease-in-out infinite; }
    @keyframes nudge { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(4px); } }
    @media (prefers-reduced-motion: reduce) { .nudge, .shimmer { animation: none; } }
  </style>

  <rect x=".5" y=".5" width="439" height="67" rx="33.5" fill="#0E1712" stroke="#27382C"/>

  <g clip-path="url(#pill)"><rect class="shimmer" x="0" y="0" width="120" height="68" fill="url(#shimmer)"/></g>

  <!-- icon -->
  <circle cx="34" cy="34" r="20" fill="#A8E063"/>
  <g fill="none" stroke="#0E1712" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M34 25 V39"/>
    <path d="M28 33.5 L34 39.5 L40 33.5"/>
    <path d="M27.5 44 H40.5"/>
  </g>

  <!-- text -->
  <g font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
    <text x="68" y="31" font-size="19" font-weight="600" fill="#F2F6F3">Download the demo</text>
    <text x="68" y="49" font-size="12.5" fill="#7F9487">Android APK  ·  16.7 MB  ·  no sign-up</text>
  </g>

  <!-- arrow -->
  <g class="nudge" fill="none" stroke="#A8E063" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M394 34 H412"/>
    <path d="M405 27 L412 34 L405 41"/>
  </g>
</svg>
