<svg xmlns="http://www.w3.org/2000/svg" width="440" height="92" viewBox="0 0 440 92" role="img" aria-label="Download the SmartFridge demo APK">
  <title>Download the SmartFridge demo APK</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4C8A24"/>
      <stop offset="1" stop-color="#2F5A16"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#142A0B" flood-opacity=".35"/>
    </filter>
  </defs>

  <!-- button body -->
  <rect x="4" y="3" width="432" height="80" rx="20" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="4" y="3" width="432" height="40" rx="20" fill="url(#shine)"/>
  <rect x="4.75" y="3.75" width="430.5" height="78.5" rx="19.25" fill="none" stroke="#B8D490" stroke-opacity=".55" stroke-width="1.5"/>

  <!-- download icon -->
  <circle cx="52" cy="43" r="26" fill="#FFFFFF" fill-opacity=".16"/>
  <circle cx="52" cy="43" r="26" fill="none" stroke="#FFFFFF" stroke-opacity=".5" stroke-width="1.5"/>
  <g fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M52 29 V50"/>
    <path d="M42 41 L52 51 L62 41"/>
    <path d="M40 58 H64"/>
  </g>

  <!-- text -->
  <text x="94" y="40" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">Download the demo APK</text>
  <text x="94" y="62" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#DDEBC8">Android 8.0+  ·  sample data  ·  no sign-up, no keys</text>

  <!-- android mark -->
  <g transform="translate(392 30)" fill="#FFFFFF" fill-opacity=".92">
    <path d="M2 18 a14 14 0 0 1 28 0 Z"/>
    <circle cx="10.5" cy="12" r="1.7" fill="#2F5A16"/>
    <circle cx="21.5" cy="12" r="1.7" fill="#2F5A16"/>
    <path d="M7 3 L10 8" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    <path d="M25 3 L22 8" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  </g>
</svg>
